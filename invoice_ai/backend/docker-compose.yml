services:
  db:
    image: postgres:16
    container_name: invoice_ai_db
    environment:
      POSTGRES_USER: invoiceai
      POSTGRES_PASSWORD: invoiceai
      POSTGRES_DB: invoiceai
    ports:
      - "5432:5432"
    volumes:
      - invoice_ai_pgdata:/var/lib/postgresql/data

volumes:
  invoice_ai_pgdata:
